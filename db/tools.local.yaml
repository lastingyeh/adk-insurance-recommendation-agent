kind: source
name: insurance_postgres
type: postgres
host: ${DB_HOST}
port: ${DB_PORT}
user: ${DB_USER}
password: "${DB_PASSWORD}"
database: ${DB_NAME}

---
kind: embeddingModel
name: vertex_embedding
type: gemini
model: gemini-embedding-001
# 預設走 Vertex：讀容器內的 GOOGLE_CLOUD_PROJECT/LOCATION + ADC。
# 無 GCP 的 B 方案（key 模式）：加一行 apiKey 欄位指向環境變數 GOOGLE_API_KEY（語法為錢字號加大括號），
# 並確保 toolbox 容器「不」帶 GOOGLE_CLOUD_PROJECT/LOCATION（否則 project 會覆蓋 apiKey、強制走 Vertex）。
# 注意：toolbox 會對整個檔（含註解）做環境變數替換，故此處不直接寫出該語法以免解析時報變數未設定。
dimension: 768

---
kind: tool
name: search_medical_products
type: postgres-sql
source: insurance_postgres
description: Search medical insurance products by age and annual budget.
parameters:
  - name: age
    type: integer
    description: User age.
  - name: budget
    type: integer
    description: Annual insurance budget.
statement: |
  WITH input(age, budget) AS (
    SELECT $1::INT, $2::INT
  )
  SELECT
    p.product_id,
    p.product_name,
    p.product_type,
    p.annual_premium_min,
    p.annual_premium_max,
    p.coverage_focus,
    p.coverage_summary,
    p.waiting_period_days,
    p.exclusions,
    CASE
      WHEN p.annual_premium_max <= input.budget THEN 'fully_within_budget'
      WHEN p.annual_premium_min <= input.budget THEN 'entry_affordable'
      ELSE 'over_budget'
    END AS budget_fit
  FROM insurance_products p
  CROSS JOIN input
  WHERE p.is_active = 1
    AND input.age BETWEEN p.target_age_min AND p.target_age_max
    AND p.annual_premium_min <= input.budget
    AND p.product_type = 'medical'
  ORDER BY
    CASE
      WHEN p.annual_premium_max <= input.budget THEN 0
      ELSE 1
    END,
    p.annual_premium_min ASC;

